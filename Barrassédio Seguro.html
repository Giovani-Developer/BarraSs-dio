<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Barrassédio Seguro</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f8f7;
        --card: #fff;
        --ink: #0b2f4a;
        --mut: #3d5a6c;
        --line: #d5e3e0;
        --fld: #7c9a95;
        --acc: #0f766e;
        --navy: #0b2f4a;
        --warn: #7a4b00;
        --wbg: #fef3c7;
        --ok: #065f46;
        --okbg: #d1fae5;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.55 Inter,
          system-ui,
          sans-serif;
      }
      a {
        color: var(--acc);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--navy);
        outline-offset: 2px;
      }
      .skip {
        position: absolute;
        left: -999px;
      }
      .skip:focus {
        left: 8px;
        top: 8px;
        background: #fff;
        padding: 8px;
        z-index: 9;
      }
      .btn {
        min-height: 44px;
        padding: 0 22px;
        border-radius: 10px;
        border: 2px solid var(--acc);
        background: transparent;
        color: var(--ink);
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        cursor: pointer;
      }
      .pri {
        background: var(--acc);
        color: #fff;
      }
      .dng {
        border-color: #9b1c1c;
        color: #9b1c1c;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px 32px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 20px;
        color: var(--ink);
        text-decoration: none;
      }
      nav {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      nav a {
        padding: 8px 12px;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
      }
      nav a[aria-current="page"] {
        background: var(--line);
        color: var(--ink);
      }
      #mb {
        display: none;
      }
      @media (max-width: 800px) {
        #mb {
          display: inline-flex;
        }
        nav {
          display: none;
          width: 100%;
          flex-direction: column;
        }
        nav.open {
          display: flex;
        }
        header {
          padding: 12px 20px;
        }
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 48px 32px;
      }
      @media (max-width: 600px) {
        main {
          padding: 28px 18px;
        }
      }
      h1 {
        margin: 0 0 14px;
        font-size: clamp(30px, 5vw, 46px);
        font-weight: 800;
        line-height: 1.1;
      }
      h1:focus {
        outline: 0;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      h3 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .lead {
        font-size: 18px;
        color: var(--mut);
        margin: 0 0 22px;
      }
      .cap {
        font-size: 14px;
        color: var(--mut);
        margin: 0 0 14px;
      }
      .flex {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
      }
      .g {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        min-width: 0;
      }
      .navy {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      .navy .cap {
        color: #cfe3ee;
      }
      .sec {
        margin-top: 56px;
      }
      .ic {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: #ddf0ec;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
      }
      .num {
        display: inline-flex;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--acc);
        color: #fff;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        margin-bottom: 8px;
      }
      label,
      legend {
        display: block;
        font-weight: 600;
        margin: 14px 0 6px;
        padding: 0;
      }
      label small {
        font-weight: 400;
        color: var(--mut);
      }
      input[type="text"],
      input[type="date"],
      input[type="password"],
      textarea,
      select {
        width: 100%;
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid var(--fld);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        border: 1px solid var(--fld);
        border-radius: 999px;
        padding: 8px 16px;
        margin: 0;
        font-weight: 400;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .chk {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-weight: 400;
      }
      .chk input {
        margin-top: 5px;
      }
      .err {
        color: var(--warn);
        background: var(--wbg);
        border-radius: 8px;
        font-size: 14px;
      }
      .err:not(:empty) {
        padding: 6px 10px;
        margin-top: 6px;
      }
      .note {
        background: var(--wbg);
        color: var(--warn);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 15px;
      }
      .urg {
        background: #fdecec;
        color: #7a1414;
        border-radius: 12px;
        padding: 16px 18px;
      }
      .big {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 2px;
        margin-bottom: 10px;
        word-break: break-all;
      }
      .dots {
        display: flex;
        gap: 6px;
        margin: 8px 0 16px;
      }
      .dots i {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
      }
      .dots i.on {
        background: var(--acc);
      }
      details {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        margin-bottom: 10px;
      }
      summary {
        padding: 14px 16px;
        font-weight: 600;
        cursor: pointer;
        min-height: 44px;
      }
      details p {
        margin: 0;
        padding: 0 16px 14px;
        color: var(--mut);
      }
      .b {
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        background: #e5e7eb;
        color: #374151;
      }
      .s-R {
        background: #fef3c7;
        color: #7a4b00;
      }
      .s-A {
        background: #dbeafe;
        color: #1e3a8a;
      }
      .s-E {
        background: #e0e7ff;
        color: #3730a3;
      }
      .s-W {
        background: #ffe4d5;
        color: #7c2d12;
      }
      .s-C {
        background: var(--okbg);
        color: var(--ok);
      }
      .tl {
        list-style: none;
        margin: 0;
        padding: 0 0 0 18px;
        border-left: 3px solid var(--line);
      }
      .tl li {
        position: relative;
        padding: 0 0 18px 16px;
      }
      .tl li:before {
        content: "";
        position: absolute;
        left: -26px;
        top: 5px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--acc);
        border: 3px solid #fff;
        box-shadow: 0 0 0 1px var(--acc);
      }
      .adm {
        display: flex;
        flex-wrap: wrap;
        min-height: 100vh;
      }
      aside {
        flex: 0 0 220px;
        background: var(--navy);
        color: #fff;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      aside .btn {
        justify-content: flex-start;
        border: 0;
        color: #fff;
        min-height: 40px;
        padding: 0 10px;
      }
      aside .btn[aria-current="page"] {
        background: #173f5c;
      }
      .am {
        flex: 1 1 640px;
        padding: 28px;
        min-width: 0;
      }
      .am h1 {
        font-size: 28px;
      }
      .tw {
        overflow-x: auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        text-align: left;
      }
      th {
        background: var(--line);
        padding: 11px;
      }
      td {
        padding: 11px;
        border-top: 1px solid var(--line);
      }
      .stat {
        font-size: 32px;
        font-weight: 800;
        line-height: 1;
      }
      .stat small {
        display: block;
        font-size: 13px;
        color: var(--mut);
        font-weight: 600;
        margin-top: 6px;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        margin: 7px 0;
      }
      .bar span:first-child {
        flex: 0 0 110px;
      }
      .bar i {
        display: block;
        height: 14px;
        border-radius: 7px;
        background: var(--acc);
      }
      .bar div {
        flex: 1;
        background: var(--line);
        border-radius: 7px;
      }
      .cols {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 150px;
        margin-top: 8px;
      }
      .cols div {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        height: 100%;
        font-size: 13px;
      }
      .cols i {
        display: block;
        width: 100%;
        background: var(--acc);
        border-radius: 6px 6px 0 0;
        min-height: 2px;
      }
      .fl {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 16px;
      }
      .fl label {
        margin: 0;
        font-weight: 400;
      }
      .fl select,
      .fl input {
        width: auto;
        min-height: 40px;
      }
      dialog {
        border: 0;
        border-radius: 16px;
        padding: 24px;
        max-width: 440px;
        width: calc(100% - 32px);
      }
      dialog::backdrop {
        background: rgba(11, 47, 74, 0.55);
      }
      #toasts {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 20;
      }
      .t {
        padding: 12px 16px;
        border-radius: 10px;
        color: #fff;
        background: var(--ok);
        font-weight: 600;
        max-width: 320px;
      }
      .t.e {
        background: #9b1c1c;
      }
      footer {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 32px 40px;
        font-size: 14px;
        color: var(--mut);
      }
      footer button {
        background: none;
        border: 1px solid var(--fld);
        border-radius: 8px;
        min-height: 36px;
        padding: 0 12px;
        margin-left: 8px;
        cursor: pointer;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <button class="skip" onclick="document.querySelector('h1').focus()">Ir para o conteúdo</button>
    <div id="app"></div>
    <dialog id="dlg" aria-labelledby="dt"></dialog>
    <div id="toasts" role="status" aria-live="polite"></div>
    <script>
      /* ===== dados e constantes ===== */
      const CAT = { m: "Assédio moral", s: "Assédio sexual", d: "Discriminação", o: "Outros" };
      const ST = {
        R: "Recebido",
        A: "Em análise",
        E: "Em andamento",
        W: "Aguardando informações",
        C: "Encerrado",
      };
      const K = "bs_v3",
        DEMO = "DEMO1234";
      const SEED = [
        ["m", "R", "2026-11-20", "Setor administrativo"],
        ["s", "A", "2026-11-12", "Sala de aula"],
        ["d", "C", "2026-10-28", "Refeitório"],
        ["m", "E", "2026-10-15", "Laboratório"],
        ["o", "W", "2026-10-03", "Online"],
        ["m", "C", "2026-09-21", "Biblioteca"],
        ["s", "C", "2026-09-09", "Estacionamento"],
        ["d", "A", "2026-08-30", "Pátio"],
        ["m", "R", "2026-08-14", "Setor financeiro"],
        ["s", "E", "2026-07-22", "Sala de aula"],
        ["o", "C", "2026-07-05", "Online"],
        ["m", "C", "2026-06-18", "Secretaria"],
      ];
      const IC = {
        shield:
          '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
        lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
        chat: '<path d="M4 5h16v11H9l-5 4z"/>',
        info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
      };
      const ico = (n, c = "#0F766E", s = 22) =>
        `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" aria-hidden="true">${IC[n]}</svg>`;
      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
          );
      const fd = (i) => i.split("-").reverse().join("/"),
        today = () => new Date().toISOString().slice(0, 10);
      /* ===== serviços (camada isolada: trocar por API no futuro) ===== */
      let mem = null;
      const Svc = {
        list() {
          try {
            const v = localStorage.getItem(K);
            if (v) return JSON.parse(v);
          } catch (e) {}
          return mem || [];
        },
        save(d) {
          mem = d;
          try {
            localStorage.setItem(K, JSON.stringify(d));
          } catch (e) {}
        },
        async hash(s) {
          const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
          return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
        },
        rnd(n) {
          const a = new Uint32Array(n);
          crypto.getRandomValues(a);
          return [...a].map((x) => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x % 32]).join("");
        },
        async seed() {
          const h = await this.hash(DEMO);
          this.save(
            SEED.map((x, i) => ({
              id: "BS-DEMO" + String(i + 1).padStart(4, "0"),
              cat: x[0],
              status: x[1],
              date: x[2],
              loc: x[3],
              desc: "Relato de exemplo (fictício).",
              freq: "Repetidamente",
              wit: "Não",
              evid: "Não",
              extra: "",
              ident: "",
              pw: h,
              hist:
                x[1] === "R"
                  ? [{ s: "R", at: x[2], note: "Relato registrado." }]
                  : [
                      { s: "R", at: x[2], note: "Relato registrado." },
                      { s: x[1], at: x[2], note: "Atualização de exemplo (fictícia)." },
                    ],
            })),
          );
        },
        async create(f) {
          const pw = this.rnd(12),
            r = {
              id: "BS-" + this.rnd(8),
              status: "R",
              date: today(),
              pw: await this.hash(pw),
              hist: [{ s: "R", at: today(), note: "Relato registrado." }],
              ...f,
            },
            d = this.list();
          d.unshift(r);
          this.save(d);
          return { id: r.id, pw };
        },
        async find(id, pw) {
          const h = await this.hash(pw);
          return this.list().find((r) => r.id === id.trim().toUpperCase() && r.pw === h);
        },
        update(id, s, note) {
          const d = this.list(),
            r = d.find((x) => x.id === id);
          r.status = s;
          r.hist.push({ s, at: today(), note: note || "Status atualizado." });
          this.save(d);
        },
      };
      /* ===== componentes ===== */
      function toast(m, e) {
        const t = document.createElement("div");
        t.className = "t" + (e ? " e" : "");
        t.textContent = m;
        $("#toasts").append(t);
        setTimeout(() => t.remove(), 4000);
      }
      function ask(title, msg, cb) {
        const d = $("#dlg");
        d.innerHTML = `<h2 id="dt">${title}</h2><p>${msg}</p><p style="display:flex;gap:8px;justify-content:flex-end;margin:0"><button class="btn" onclick="$('#dlg').close()">Cancelar</button><button class="btn pri" id="ok">Confirmar</button></p>`;
        $("#ok").onclick = () => {
          d.close();
          cb();
        };
        d.showModal();
      }
      const fe = (id, m) => {
        $("#e-" + id).textContent = m;
        const f = $("#" + id);
        if (f) f.setAttribute("aria-invalid", !!m);
      };
      const bars = (items) => {
        const mx = Math.max(1, ...items.map((i) => i[1]));
        return items
          .map(
            (i) =>
              `<div class="bar"><span>${i[0]}</span><div><i style="width:${(i[1] / mx) * 100}%"></i></div><b>${i[1]}</b></div>`,
          )
          .join("");
      };
      const badge = (s) => `<span class="b s-${s}">${ST[s]}</span>`;
      const tline = (h) =>
        `<ol class="tl">${[...h]
          .reverse()
          .map(
            (x) =>
              `<li><strong>${ST[x.s]}</strong> <span class="cap">${fd(x.at)}</span><br>${esc(x.note)}</li>`,
          )
          .join("")}</ol>`;
      const risco =
        '<div class="urg"><strong>Risco imediato?</strong> Ligue 190 (polícia) ou procure a segurança do local. Esta plataforma é uma demonstração e não atende emergências.</div>';
      /* ===== páginas públicas ===== */
      const P = {};
      P.inicio =
        () => `<h1 tabindex="-1">Sua voz merece ser ouvida. Sua identidade merece ser protegida.</h1>
<div class="flex" style="gap:40px;align-items:center"><div style="flex:1 1 420px"><p class="lead">Registre uma situação de assédio sem criar conta e sem informar e-mail. Você recebe um protocolo e uma senha para acompanhar o caso.</p><p style="display:flex;flex-wrap:wrap;gap:12px;margin:0"><a class="btn pri" href="#novo-relato">Fazer um relato</a><a class="btn" href="#acompanhar">Acompanhar relato</a></p></div><div class="card navy" style="flex:1 1 300px">${ico("shield", "#fff", 34)}<h2 style="margin-top:8px">Privacidade primeiro</h2><p class="cap">Nenhum e-mail, nenhuma conta e nenhum relato exibido publicamente.</p></div></div>
<section class="sec"><h2>Como funciona</h2><div class="g"><div class="card"><span class="num">1</span><h3>Relate</h3><p class="cap">Escolha a categoria e descreva o ocorrido, em duas etapas.</p></div><div class="card"><span class="num">2</span><h3>Guarde seu acesso</h3><p class="cap">Você recebe protocolo e senha. Não há recuperação de senha.</p></div><div class="card"><span class="num">3</span><h3>Acompanhe</h3><p class="cap">Consulte o status e a linha do tempo quando quiser.</p></div></div></section>
<section class="sec"><h2>Situações que podem ser relatadas</h2><div class="g">${[
          ["Assédio moral", "Humilhações, ameaças, isolamento e pressão abusiva.", "chat"],
          ["Assédio sexual", "Investidas, comentários ou contatos indesejados.", "shield"],
          [
            "Discriminação",
            "Tratamento desigual por origem, gênero, raça, deficiência e outros motivos.",
            "info",
          ],
          ["Outros", "Situações que não se encaixam nas categorias acima.", "lock"],
        ]
          .map(
            (c) =>
              `<div class="card"><div class="ic">${ico(c[2])}</div><h3>${c[0]}</h3><p class="cap">${c[1]}</p></div>`,
          )
          .join("")}</div></section>
<section class="sec flex"><div class="card" style="flex:1 1 380px"><h2>Anonimato e privacidade</h2><p class="cap">Identificação é sempre opcional. Esta demonstração guarda os dados apenas no seu navegador e não envia nada a ninguém.</p></div><div style="flex:1 1 380px">${risco}<p class="cap" style="margin-top:12px">Para orientação e canais oficiais, veja a página <a href="#orientacao">Orientação</a>.</p></div></section>`;
      let W = { step: 1, d: {} };
      P["novo-relato"] = () => {
        if (W.step === 3)
          return `<h1 tabindex="-1">Relato registrado</h1><div class="card navy" style="max-width:560px"><p class="cap">Esta tela aparece uma única vez.</p><div class="cap">Protocolo</div><div class="big">${W.r.id}</div><div class="cap">Senha de acompanhamento</div><div class="big">${W.r.pw}</div><p class="note">Guarde agora. Não existe recuperação de senha neste protótipo.</p></div><p style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn pri" href="#acompanhar">Acompanhar relato</a><button class="btn" onclick="W={step:1,d:{}};route()">Novo relato</button></p>`;
        const d = W.d;
        return (
          `<h1 tabindex="-1">Novo relato</h1><p class="lead">Nenhum e-mail ou conta é necessário. Campos marcados como opcionais podem ficar em branco.</p><form class="card" style="max-width:680px" onsubmit="stepNext(event)" novalidate><p class="cap" style="margin:0">Etapa ${W.step} de 2</p><div class="dots" aria-hidden="true"><i class="on"></i><i class="${W.step === 2 ? "on" : ""}"></i></div>` +
          (W.step === 1
            ? `<fieldset><legend>Categoria</legend>${Object.entries(CAT)
                .map(
                  ([k, v]) =>
                    `<label class="chip"><input type="radio" name="cat" value="${k}" ${d.cat === k ? "checked" : ""}> ${v}</label>`,
                )
                .join("")}</fieldset><div class="err" id="e-cat"></div>
<label for="desc">Descrição detalhada</label><textarea id="desc" rows="5" aria-describedby="e-desc">${esc(d.desc)}</textarea><div class="err" id="e-desc"></div>
<label for="loc">Local onde aconteceu</label><input type="text" id="loc" value="${esc(d.loc)}" aria-describedby="e-loc"><div class="err" id="e-loc"></div>
<label for="dt2">Data aproximada <small>(opcional)</small></label><input type="date" id="dt2" max="${today()}" value="${d.dt || ""}">
<label for="ident">Nome para identificação <small>(opcional. Deixe em branco para permanecer anônimo)</small></label><input type="text" id="ident" value="${esc(d.ident)}" autocomplete="off">`
            : `<label for="freq">Frequência</label><select id="freq"><option>Uma única vez</option><option ${d.freq === "Repetidamente" ? "selected" : ""}>Repetidamente</option></select>
<label for="wit">Existem testemunhas?</label><select id="wit"><option>Não</option><option ${d.wit === "Sim" ? "selected" : ""}>Sim</option></select>
<label for="evid">Existem evidências?</label><select id="evid"><option>Não</option><option ${d.evid === "Sim" ? "selected" : ""}>Sim</option></select>
<label for="extra">Informações adicionais <small>(opcional)</small></label><textarea id="extra" rows="3">${esc(d.extra)}</textarea>
<label class="chk"><input type="checkbox" id="ok2" aria-describedby="e-ok2"> Entendo que este é um protótipo e que não existe recuperação de senha.</label><div class="err" id="e-ok2"></div>`) +
          `<p style="display:flex;gap:10px;margin:18px 0 0">${W.step === 2 ? '<button type="button" class="btn" onclick="W.step=1;route()">Voltar</button>' : ""}<button class="btn pri" type="submit" style="flex:1">${W.step === 1 ? "Próxima etapa" : "Enviar relato"}</button></p></form>`
        );
      };
      async function stepNext(e) {
        e.preventDefault();
        const d = W.d;
        if (W.step === 1) {
          const cat = document.querySelector("[name=cat]:checked"),
            desc = $("#desc").value.trim(),
            loc = $("#loc").value.trim();
          let bad = 0;
          fe("cat", cat ? "" : ((bad = 1), "Escolha uma categoria."));
          fe(
            "desc",
            desc.length >= 20 ? "" : ((bad = 1), "Descreva com pelo menos 20 caracteres."),
          );
          fe("loc", loc ? "" : ((bad = 1), "Informe o local."));
          if (bad) return toast("Corrija os campos destacados.", 1);
          Object.assign(d, {
            cat: cat.value,
            desc,
            loc,
            dt: $("#dt2").value,
            ident: $("#ident").value.trim(),
          });
          W.step = 2;
          route();
          return;
        }
        if (!$("#ok2").checked) {
          fe("ok2", "Confirme para continuar.");
          return toast("Confirme o entendimento.", 1);
        }
        Object.assign(d, {
          freq: $("#freq").value,
          wit: $("#wit").value,
          evid: $("#evid").value,
          extra: $("#extra").value.trim(),
        });
        W.r = await Svc.create({
          cat: d.cat,
          desc: d.desc,
          loc: d.loc,
          freq: d.freq,
          wit: d.wit,
          evid: d.evid,
          extra: d.extra,
          ident: d.ident,
        });
        W.step = 3;
        route();
        toast("Relato registrado com sucesso.");
      }
      let T = null;
      P.acompanhar =
        () => `<h1 tabindex="-1">Acompanhar relato</h1><div class="flex" style="align-items:flex-start"><form class="card" style="flex:1 1 340px;max-width:440px" onsubmit="doTrack(event)" novalidate><label for="tp" style="margin-top:0">Protocolo</label><input type="text" id="tp" autocomplete="off" aria-describedby="e-tp"><label for="tw">Senha</label><input type="password" id="tw" autocomplete="off"><div class="err" id="e-tp"></div><p class="cap" style="margin-top:12px">Para testar: protocolo BS-DEMO0001, senha ${DEMO}.</p><button class="btn pri" style="width:100%">Consultar</button></form>
<div style="flex:2 1 420px">${T ? `<div class="card"><h2>${T.id} ${badge(T.status)}</h2><p class="cap">${CAT[T.cat]} · registrado em ${fd(T.date)}</p><h3>Linha do tempo</h3>${tline(T.hist)}</div>` : '<div class="card"><p class="cap" style="margin:0">O resultado da consulta aparece aqui.</p></div>'}</div></div>`;
      async function doTrack(e) {
        e.preventDefault();
        const r = await Svc.find($("#tp").value, $("#tw").value);
        if (!r) {
          T = null;
          route();
          fe("tp", "Protocolo ou senha incorretos.");
          return toast("Não foi possível localizar o relato.", 1);
        }
        T = r;
        route();
        toast("Relato localizado.");
      }
      P.orientacao = () => {
        const q = [
          [
            "O que é assédio moral?",
            "Exposição repetida a humilhações, constrangimentos ou pressão abusiva que ferem a dignidade da pessoa.",
          ],
          [
            "O que é assédio sexual?",
            "Conduta de natureza sexual não desejada, como insinuações, comentários ou contatos, que constrange a pessoa.",
          ],
          [
            "O que caracteriza discriminação?",
            "Tratamento desigual ou excludente por motivo de origem, gênero, raça, orientação, deficiência, religião ou outro.",
          ],
          [
            "Como identificar situações de assédio?",
            "Observe repetição, desconforto, medo, isolamento ou ameaças ligadas a quem tem poder sobre você.",
          ],
          [
            "Como agir diante de uma situação?",
            "Afaste-se se for seguro, registre o que ocorreu e procure alguém de confiança ou um canal oficial.",
          ],
          [
            "Como preservar evidências?",
            "Guarde mensagens, e-mails, datas, locais e nomes de testemunhas. Anote os fatos o quanto antes.",
          ],
          [
            "Como buscar ajuda e apoio?",
            "Converse com pessoas de confiança e procure apoio psicológico ou jurídico profissional.",
          ],
          [
            "Quais são os canais oficiais?",
            "Ligue 180 (violência contra a mulher), Disque 100 (direitos humanos) e 188 (apoio emocional, CVV). Confirme os canais nos sites oficiais.",
          ],
        ];
        return `<h1 tabindex="-1">Orientação</h1><p class="lead">Informações gerais para ajudar você a entender e agir.</p><div class="flex" style="align-items:flex-start"><div style="flex:2 1 460px">${q.map((x) => `<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join("")}</div><div style="flex:1 1 300px">${risco}<p class="note" style="margin-top:14px">Esta plataforma não substitui canais oficiais, atendimento psicológico nem orientação jurídica.</p></div></div>`;
      };
      /* ===== painel administrativo (simulação, sem autenticação) ===== */
      let A = { v: "dash", sel: null, q: "", cat: "", st: "", per: "" };
      const filt = () => {
        const lim = A.per ? new Date(Date.now() - A.per * 864e5).toISOString().slice(0, 10) : "";
        return Svc.list().filter(
          (r) =>
            (!A.q || r.id.includes(A.q.toUpperCase())) &&
            (!A.cat || r.cat === A.cat) &&
            (!A.st || r.status === A.st) &&
            (!lim || r.date >= lim),
        );
      };
      function adminView() {
        const d = Svc.list();
        const cnt = (k) => d.filter((r) => r.status === k).length;
        if (A.v === "dash") {
          const ms = {};
          d.forEach((r) => {
            const m = r.date.slice(0, 7);
            ms[m] = (ms[m] || 0) + 1;
          });
          const mk = Object.keys(ms).sort().slice(-6),
            mx = Math.max(1, ...mk.map((k) => ms[k]));
          return `<h1>Dashboard</h1><div class="g" style="margin-bottom:20px">${[
            ["Total", d.length],
            ["Recebidos", cnt("R")],
            ["Em análise", cnt("A")],
            ["Em andamento", cnt("E")],
            ["Encerrados", cnt("C")],
          ]
            .map(
              (x) =>
                `<div class="card"><div class="stat">${x[1]}<small>${x[0]}</small></div></div>`,
            )
            .join(
              "",
            )}</div><div class="g"><div class="card"><h3>Por categoria</h3>${bars(Object.entries(CAT).map(([k, v]) => [v, d.filter((r) => r.cat === k).length]))}</div><div class="card"><h3>Distribuição por status</h3>${bars(Object.entries(ST).map(([k, v]) => [v, cnt(k)]))}</div><div class="card"><h3>Evolução mensal</h3><div class="cols">${mk.map((k) => `<div><span>${ms[k]}</span><i style="height:${(ms[k] / mx) * 100}%"></i><span>${k.slice(5)}/${k.slice(2, 4)}</span></div>`).join("")}</div></div></div>`;
        }
        if (A.v === "rel") {
          const l = filt(),
            r = d.find((x) => x.id === A.sel);
          return `<h1>Relatos</h1><div class="fl"><label>Protocolo <input type="text" value="${esc(A.q)}" oninput="A.q=this.value;relRows()" aria-label="Pesquisar protocolo"></label><label>Categoria <select onchange="A.cat=this.value;route()"><option value="">Todas</option>${Object.entries(
            CAT,
          )
            .map(([k, v]) => `<option value="${k}" ${A.cat === k ? "selected" : ""}>${v}</option>`)
            .join(
              "",
            )}</select></label><label>Status <select onchange="A.st=this.value;route()"><option value="">Todos</option>${Object.entries(
            ST,
          )
            .map(([k, v]) => `<option value="${k}" ${A.st === k ? "selected" : ""}>${v}</option>`)
            .join(
              "",
            )}</select></label><label>Período <select onchange="A.per=this.value;route()"><option value="">Tudo</option><option value="30" ${A.per === "30" ? "selected" : ""}>30 dias</option><option value="90" ${A.per === "90" ? "selected" : ""}>90 dias</option></select></label></div>
<div class="flex" style="align-items:flex-start"><div class="tw" style="flex:1 1 460px"><table><thead><tr><th>Protocolo</th><th>Categoria</th><th>Recebido</th><th>Status</th><th></th></tr></thead><tbody id="rows">${rowsHtml(l)}</tbody></table></div>${
            r
              ? `<div class="card" style="flex:1 1 320px"><h2>${r.id} ${badge(r.status)}</h2><p class="cap">${CAT[r.cat]} · ${fd(r.date)} · ${esc(r.loc)}</p><p>${esc(r.desc)}</p><p class="cap">Frequência: ${r.freq} · Testemunhas: ${r.wit} · Evidências: ${r.evid}${r.extra ? "<br>Adicional: " + esc(r.extra) : ""}${r.ident ? "<br>Identificação: " + esc(r.ident) : "<br>Relato anônimo."}</p><h3>Histórico</h3>${tline(r.hist)}<label for="ns">Atualizar status</label><select id="ns">${Object.entries(
                  ST,
                )
                  .map(
                    ([k, v]) =>
                      `<option value="${k}" ${r.status === k ? "selected" : ""}>${v}</option>`,
                  )
                  .join(
                    "",
                  )}</select><label for="nn">Observação <small>(visível ao denunciante)</small></label><textarea id="nn" rows="3"></textarea><p style="margin:12px 0 0"><button class="btn pri" onclick="applySt('${r.id}')">Atualizar</button></p></div>`
              : ""
          }</div>`;
        }
        const h = d
          .flatMap((r) => r.hist.map((x) => ({ ...x, id: r.id })))
          .sort((a, b) => b.at.localeCompare(a.at))
          .slice(0, 20);
        return `<h1>Histórico de alterações</h1><div class="tw"><table><thead><tr><th>Data</th><th>Protocolo</th><th>Status</th><th>Observação</th></tr></thead><tbody>${h.map((x) => `<tr><td>${fd(x.at)}</td><td>${x.id}</td><td>${badge(x.s)}</td><td>${esc(x.note)}</td></tr>`).join("")}</tbody></table></div>`;
      }
      const rowsHtml = (l) =>
        l
          .map(
            (r) =>
              `<tr><td><strong>${r.id}</strong></td><td>${CAT[r.cat]}</td><td>${fd(r.date)}</td><td>${badge(r.status)}</td><td><button class="btn" style="min-height:36px;padding:0 12px" onclick="A.sel='${r.id}';route()">Detalhes</button></td></tr>`,
          )
          .join("") || '<tr><td colspan="5">Nenhum relato encontrado.</td></tr>';
      function relRows() {
        $("#rows").innerHTML = rowsHtml(filt());
      }
      function applySt(id) {
        const s = $("#ns").value,
          n = $("#nn").value.trim();
        ask("Atualizar status", `Alterar o relato ${id} para “${ST[s]}”?`, () => {
          Svc.update(id, s, n);
          route();
          toast("Status atualizado.");
        });
      }
      P.admin = () =>
        `<div class="adm"><aside><a class="brand" style="color:#fff;margin-bottom:12px" href="#inicio">${ico("shield", "#fff", 24)} Painel</a>${[
          ["dash", "Dashboard"],
          ["rel", "Relatos"],
          ["his", "Histórico"],
        ]
          .map(
            (x) =>
              `<button class="btn" ${A.v === x[0] ? 'aria-current="page"' : ""} onclick="A.v='${x[0]}';route()">${x[1]}</button>`,
          )
          .join(
            "",
          )}<a class="btn" href="#inicio" style="margin-top:12px">← Voltar ao site</a><p class="cap" style="color:#CFE3EE;margin-top:auto">Simulação sem autenticação real. Dados fictícios.</p></aside><main class="am" style="padding:28px"><span id="mt"></span>${adminView().replace("<h1>", '<h1 tabindex="-1">')}</main></div>`;
      /* ===== layout e roteador ===== */
      const NAV = [
        ["inicio", "Início"],
        ["novo-relato", "Novo relato"],
        ["acompanhar", "Acompanhar"],
        ["orientacao", "Orientação"],
        ["admin", "Painel admin"],
      ];
      function route() {
        const r = location.hash.slice(1) || "inicio",
          k = P[r] ? r : "inicio",
          app = $("#app");
        if (k === "admin") {
          app.innerHTML = P.admin();
          return;
        }
        app.innerHTML = `<header><a class="brand" href="#inicio">${ico("shield", "#0F766E", 28)} Barrassédio Seguro</a><button id="mb" class="btn" aria-expanded="false" aria-controls="nv" onclick="const n=$('#nv');n.classList.toggle('open');this.setAttribute('aria-expanded',n.classList.contains('open'))">Menu</button><nav id="nv" aria-label="Principal">${NAV.map((n) => `<a href="#${n[0]}" ${n[0] === k ? 'aria-current="page"' : ""}>${n[1]}</a>`).join("")}</nav></header><main id="conteudo">${P[k]()}</main><footer>Demonstração escolar: os dados ficam apenas neste navegador e nenhum relato é enviado a ninguém.<button onclick="ask('Reiniciar dados','Apagar todos os relatos e restaurar os exemplos?',async()=>{await Svc.seed();T=null;W={step:1,d:{}};route();toast('Dados reiniciados.')})">Reiniciar dados</button></footer>`;
      }
      addEventListener("hashchange", () => {
        route();
        window.scrollTo(0, 0);
        const h = $("h1");
        if (h) h.focus();
      });
      (async () => {
        try {
          if (!localStorage.getItem(K)) await Svc.seed();
        } catch (e) {
          await Svc.seed();
        }
        route();
      })();
    </script>
  </body>
</html>
